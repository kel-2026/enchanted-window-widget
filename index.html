<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Enchanted Window</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:14px 9px;background:radial-gradient(ellipse at 50% 0,#174b3a,#081b17 78%);font-family:Georgia,'Times New Roman',serif;color:#f5e5b4}.window{width:min(100%,510px);background:linear-gradient(135deg,#123d30,#05241d 48%,#12382c);border:2px solid #c6a35d;border-radius:24px;padding:12px;box-shadow:0 0 0 4px #09251c,0 0 0 5px #8b713e,0 18px 55px #0009}.inner{border:1px solid #8e773f;border-radius:17px;padding:14px 12px 17px}.stars{text-align:center;color:#e4c47e;font-size:23px;letter-spacing:13px;padding-left:13px}h1{text-align:center;font-size:clamp(20px,5vw,29px);letter-spacing:1.4px;font-weight:normal;margin:8px 0 3px}.subtitle{text-align:center;font-size:10px;letter-spacing:2.2px;margin-bottom:17px;color:#e6c886}.picture{border:2px solid #c8a45b;border-radius:46% 46% 10px 10px / 8% 8% 10px 10px;overflow:hidden;position:relative;background:#092019;box-shadow:0 0 0 3px #143f31,0 0 20px #dfbb6c35;aspect-ratio:4/4.9;isolation:isolate}.picture .backdrop{position:absolute;inset:-24px;background-position:center;background-size:cover;filter:blur(24px) brightness(.54) saturate(.85);transform:scale(1.06);z-index:-1}.picture img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}.buttons{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:7px;margin-top:17px}button{background:linear-gradient(#174d3c,#0a3027);border:1px solid #bd9951;border-radius:8px;color:#f6e6b6;font-family:Georgia,serif;font-size:clamp(11px,2.7vw,14px);padding:11px 3px;cursor:pointer}button:hover,button:focus-visible{background:#28664e;outline:2px solid #e8c983;outline-offset:2px}.counter{text-align:center;color:#e9d49d;margin-top:12px;font-size:13px;letter-spacing:2px}.footer{text-align:center;color:#bfa874;font-size:11px;letter-spacing:1.5px;margin-top:12px}@media(prefers-reduced-motion:no-preference){.picture img{transition:opacity .15s ease}}</style></head><body><main class="window"><section class="inner"><div class="stars" aria-hidden="true">✦ ✧ ✦</div><h1>THE ENCHANTED WINDOW</h1><div class="subtitle">A NEW WORLD AWAITS EACH DAY</div><div class="picture"><div id="backdrop" class="backdrop" aria-hidden="true"></div><img id="scene" alt="Fantasy artwork" fetchpriority="high"></div><div class="buttons"><button id="prev" type="button">❮ Previous</button><button id="random" type="button">✧ Surprise Me</button><button id="next" type="button">Next ❯</button></div><div id="counter" class="counter" aria-live="polite"></div><div class="footer">✧ &nbsp; A LITTLE MAGIC, EVERY DAY &nbsp; ✧</div></section></main><script>
const images=["images/scene-01.jpg", "images/scene-02.jpg", "images/scene-03.jpg", "images/scene-04.jpg", "images/scene-05.jpg", "images/scene-06.jpg", "images/scene-07.jpg", "images/scene-08.jpg", "images/scene-09.jpg", "images/scene-10.jpg", "images/scene-11.jpg", "images/scene-12.jpg", "images/scene-13.jpg", "images/scene-14.jpg", "images/scene-15.jpg", "images/scene-16.jpg", "images/scene-17.jpg", "images/scene-18.jpg", "images/scene-19.jpg", "images/scene-20.jpg", "images/scene-21.jpg", "images/scene-22.jpg", "images/scene-23.jpg", "images/scene-24.jpg", "images/scene-25.jpg", "images/scene-26.jpg", "images/scene-27.jpg", "images/scene-28.jpg", "images/scene-29.jpg", "images/scene-30.jpg", "images/scene-31.jpg", "images/scene-32.jpg", "images/scene-33.jpg", "images/scene-34.jpg", "images/scene-35.jpg", "images/scene-36.jpg", "images/scene-37.jpg", "images/scene-38.jpg", "images/scene-39.jpg", "images/scene-40.jpg", "images/scene-41.jpg", "images/scene-42.jpg", "images/scene-43.jpg", "images/scene-44.jpg", "images/scene-45.jpg", "images/scene-46.jpg", "images/scene-47.jpg", "images/scene-48.jpg", "images/scene-49.jpg", "images/scene-50.jpg", "images/scene-51.jpg", "images/scene-52.jpg", "images/scene-53.jpg", "images/scene-54.jpg", "images/scene-55.jpg", "images/scene-56.jpg", "images/scene-57.jpg", "images/scene-58.jpg", "images/scene-59.jpg", "images/scene-60.jpg", "images/scene-61.jpg", "images/scene-62.jpg"];
// The calendar date is local to the viewer; this advances once per day.
function dailyIndex(){const now=new Date();const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());const origin=Date.UTC(2026,0,1);const days=Math.floor((today-origin)/86400000);return ((days%images.length)+images.length)%images.length;}
let index=dailyIndex();const scene=document.getElementById('scene'),backdrop=document.getElementById('backdrop'),counter=document.getElementById('counter');function show(){const src=images[index];scene.src=src;scene.alt='Fantasy scene '+(index+1)+' of '+images.length;backdrop.style.backgroundImage='url("'+src+'")';counter.textContent=(index+1)+' / '+images.length;}
document.getElementById('prev').addEventListener('click',()=>{index=(index-1+images.length)%images.length;show()});document.getElementById('next').addEventListener('click',()=>{index=(index+1)%images.length;show()});document.getElementById('random').addEventListener('click',()=>{if(images.length<2)return;let n;do{n=Math.floor(Math.random()*images.length)}while(n===index);index=n;show()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&lastDate!==new Date().toDateString()){lastDate=new Date().toDateString();index=dailyIndex();show()}});let lastDate=new Date().toDateString();show();</script></body></html>
